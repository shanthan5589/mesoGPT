[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesogpt"
version = "0.1.0"
description = "A small GPT implementation."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.6,<2.15",
    "pyarrow>=25,<26",
    "requests>=2.34,<3",
    "rustbpe==0.1.0",
    "tiktoken>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mesoGPT*", "experiments*"]
namespaces = true
