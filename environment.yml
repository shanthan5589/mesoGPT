# Portable fallback for machines that do not already provide PyTorch.
# On an official Runpod PyTorch image, run `bash setup.sh` instead. The setup
# script reuses the image's preinstalled CUDA-enabled PyTorch installation.
name: mesogpt

channels:
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.4.0+cu124
      - pyarrow>=25,<26
      - requests>=2.34,<3
      - rustbpe==0.1.0
      - tiktoken>=0.14,<0.15
